<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles/indexStyle.css">
  <title>book-library-app</title>
</head>

<body>
  <main id="mainContainer">
    <h2>Welcom to lixy Book Store</h2>


    <div style="display: inline-block">
      <form id="searchQueryForm">
        <input type="text" id="searchQueryInput" placeholder="search book..." />
        <button type="submit" id="getBooksBtn">search</button>
      </form>
    </div>

 
    <table id="booksTable" style="display: none">
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>ISBN</th>
          <th>Year</th>
          <th>Genre</th>
          <th>Available</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="errorDisplayContainer"></div>
  </main>

  <script src="../js/bookServices.js"></script>
</body>

</html>
